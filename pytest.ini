[pytest]

testpaths =
    tests
    tests_api

markers =
    smoke: pruebas principales de la aplicación
    pom: pruebas de automatización con Page Object Model
    exception: pruebas que verifican el manejo de excepciones
    api: pruebas de integración y validación de servicios REST
    e2e: pruebas end-to-end del ciclo de vida de recursos API