[pytest]
testpaths =
    tests
    tests_api

markers =
    smoke: pruebas principales de la aplicacion
    pom: pruebas de automatizacion con Page Object Model
    exception: pruebas que verifican el manejo de excepciones
    api: pruebas de integracion y validacion de servicios REST
    e2e: pruebas end-to-end del ciclo de vida de recursos API
    
addopts = -ra --html=reports/reporte.html --self-contained-html
